<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{FAVICON}}
  <title>LiteMonitor · 看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff; --surface: #ffffff; --surface2: #f6f7f9; --border: #e4e7ee;
      --text: #171717; --muted: #737373;
      --ok: #10b981; --warn: #fbbf24; --crit: #f87171; --empty: #d1d5db;
      --ok-bg: rgba(16,185,129,.14); --warn-bg: rgba(251,191,36,.18); --crit-bg: rgba(248,113,113,.16);
      --font: "Inter", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      --r-lg: 20px; --r-md: 14px;
      --shadow: 0 16px 48px rgba(18,21,26,.07), 0 2px 8px rgba(18,21,26,.04);
      --shadow-sm: 0 2px 8px rgba(18,21,26,.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); }
    body { font-family: var(--font); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .app { max-width: 1080px; margin: 0 auto; padding: 28px 24px 40px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand h1 { font-size: 16px; font-weight: 600; letter-spacing: -.025em; }
    .brand .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 2s ease infinite; }
    .brand .dot.off { background: #c3c8d1; box-shadow: none; animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .brand span { font-size: 13px; color: var(--muted); }
    .brand .ver { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
    .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn { font: 500 13px var(--font); padding: 8px 14px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface2); color: var(--muted); cursor: pointer; transition: .15s; }
    .btn:hover { color: var(--text); border-color: #cfd4de; background: #fff; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.danger { color: var(--crit); border-color: rgba(248,113,113,.35); }
    .btn.danger:hover { color: var(--crit); border-color: rgba(248,113,113,.55); background: #fff; }
    .btn.spinning .ico { display: inline-block; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .timebar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .range { display: flex; gap: 3px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 4px; flex-shrink: 0; }
    .range button { font: 500 13px var(--font); padding: 7px 14px; border: none; background: transparent; color: var(--muted); border-radius: var(--r-md); cursor: pointer; transition: .12s; }
    .range button.on { background: #fff; color: var(--text); box-shadow: var(--shadow-sm); }
    .day-nav-wrap { position: relative; display: none; align-items: center; gap: 10px; }
    .day-nav-wrap.show { display: flex; }
    .day-nav { display: flex; align-items: center; gap: 2px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 4px; }
    .day-nav .nav-btn { width: 32px; height: 32px; border: none; background: transparent; color: var(--muted); border-radius: var(--r-md); cursor: pointer; font: 500 16px var(--font); }
    .day-nav .nav-btn:hover:not(:disabled) { color: var(--text); background: #fff; }
    .day-nav .nav-btn:disabled { opacity: .3; cursor: default; }
    .day-nav .day-btn { display: inline-flex; align-items: center; justify-content: center; font: 600 13px var(--font); padding: 0 14px; height: 32px; border: none; background: #fff; color: var(--text); border-radius: var(--r-md); cursor: pointer; box-shadow: var(--shadow-sm); min-width: 148px; font-variant-numeric: tabular-nums; }
    .btn-today { font: 500 13px var(--font); padding: 7px 14px; height: 40px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); border-radius: var(--r-lg); cursor: pointer; }
    .btn-today:hover:not(:disabled) { color: var(--text); background: #fff; }
    .btn-today:disabled { opacity: .4; cursor: default; }
    .cal { display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 40; width: 280px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); }
    .cal.open { display: block; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 6px; }
    .cal-head .cal-title { font: 600 13px var(--font); }
    .cal-head .cal-nav { width: 28px; height: 28px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); border-radius: 10px; cursor: pointer; font: 500 15px var(--font); }
    .cal-head .cal-nav:disabled { opacity: .3; cursor: default; }
    .cal-dows { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-bottom: 4px; }
    .cal-dows span { text-align: center; font-size: 10px; font-weight: 600; color: var(--muted); padding: 4px 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
    .cal-day { aspect-ratio: 1; border: none; background: transparent; color: var(--text); border-radius: 10px; font: 500 12px var(--font); cursor: pointer; }
    .cal-day:hover:not(:disabled):not(.sel) { background: var(--surface2); }
    .cal-day.muted { color: var(--empty); }
    .cal-day.today:not(.sel) { box-shadow: inset 0 0 0 1.5px var(--ok); color: var(--ok); font-weight: 600; }
    .cal-day.sel { background: var(--text); color: #fff; font-weight: 600; }
    .cal-day:disabled { color: var(--empty); opacity: .55; cursor: default; }
    .cal-foot { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .cal-foot .hint { font-size: 11px; color: var(--muted); }
    .cal-foot .cal-jump { font: 500 12px var(--font); padding: 5px 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); border-radius: 8px; cursor: pointer; }

    .dash-section { margin-bottom: 18px; }
    .dash-section .sec-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 10px; margin-bottom: 8px; padding: 0 2px;
    }
    .dash-section .sec-head h2 {
      font-size: 11px; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted);
    }
    .sec-head .hint { font-size: 12px; color: var(--muted); }

    .cap {
      display: inline-flex; align-items: baseline; gap: 6px;
      padding: 6px 10px; min-height: 32px; min-width: 0; max-width: 100%;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 999px;
      font-variant-numeric: tabular-nums; line-height: 1.2;
    }
    .cap.ghost { opacity: .4; }
    .cap .cap-k { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; flex-shrink: 0; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cap .cap-v { font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; }
    .sev-ok{color:var(--ok)!important;} .sev-warn{color:var(--warn)!important;} .sev-crit{color:var(--crit)!important;}
    .neutral{color:var(--muted)!important;}

    .sec-timelines .sec-body {
      display: flex; flex-direction: column; gap: 10px;
      padding: 0; background: transparent; border: none;
    }
    .metric-head .metric-caps { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .metric-head .cap { background: #fff; padding: 4px 9px; min-height: 26px; }
    .metric-head .cap .cap-k { font-size: 10px; }
    .metric-head .cap .cap-v { font-size: 12px; }
    .legend-row { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 2px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
    .legend-item .swatch { width: 8px; height: 8px; border-radius: 999px; }
    .timelines { display: flex; flex-direction: column; gap: 10px; }
    .metric-panel { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 20px 14px; position: relative; }
    .metric-panel.hidden { display: none; }
    .metric-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 12px; }
    .metric-head .left { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
    .metric-head h2 { font-size: 14px; font-weight: 600; }
    .metric-head .totals { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
    .metric-head .totals .sep { color: var(--muted); font-weight: 500; margin: 0 6px; }
    .metric-head .totals .dir { color: var(--muted); font-weight: 500; }
    .bars { display: flex; gap: 3px; height: 28px; align-items: stretch; }
    .bar { flex: 1; border-radius: 999px; min-width: 0; cursor: crosshair; transition: transform .12s ease, opacity .12s; }
    .bar.ok{background:var(--ok);} .bar.warn{background:var(--warn);} .bar.crit{background:var(--crit);}
    .bar.empty{background:var(--empty);cursor:default;}
    .bar.empty:hover,.bar.empty.on{transform:none;opacity:1;}
    .bar:hover,.bar.on{transform:scaleY(1.14);opacity:.88;}
    .bars.volume { height: 36px; align-items: flex-end; }
    .bars.volume .bar { align-self: flex-end; background: #9ca3af; border-radius: 4px 4px 2px 2px; min-height: 3px; transform-origin: bottom center; transition: opacity .12s, filter .12s; }
    .bars.volume .bar.empty { background: var(--empty); height: 3px !important; }
    .bars.volume .bar:hover,.bars.volume .bar.on { transform: none; opacity: 1; filter: brightness(.82); }
    .bar-tip .status-dot.net{background:#9ca3af;}
    .bar-axis { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .metric-rule { margin-top: 8px; font-size: 11px; color: var(--muted); }
    .bar-tip { display: none; position: absolute; z-index: 20; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); pointer-events: none; min-width: 220px; box-shadow: var(--shadow-sm); }
    .bar-tip.show { display: block; }
    .bar-tip .time { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .bar-tip .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .bar-tip .status-dot { width: 9px; height: 9px; border-radius: 999px; flex-shrink: 0; }
    .bar-tip .status-dot.ok{background:var(--ok);} .bar-tip .status-dot.warn{background:var(--warn);} .bar-tip .status-dot.crit{background:var(--crit);} .bar-tip .status-dot.empty{background:var(--empty);}
    .bar-tip .status-label { font-size: 14px; font-weight: 600; }
    .bar-tip .status-label.neutral { color: var(--muted); }
    .bar-tip .vals { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border); }
    .pill { display: inline-block; padding: 3px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; }
    .pill.ok{background:var(--ok-bg);color:var(--ok);} .pill.warn{background:var(--warn-bg);color:var(--warn);} .pill.crit{background:var(--crit-bg);color:var(--crit);} .pill.neutral{background:rgba(115,115,115,.1);color:var(--text);}

    /* Overview — same capsule language as before, full hardware data */
    .sec-overview .sec-body {
      display: flex; flex-direction: column; gap: 10px;
      padding: 0; background: transparent; border: none;
    }
    .hw-toolbar { display: flex; gap: 8px; }
    .hw-search {
      flex: 1; font: 500 13px var(--font); padding: 8px 14px;
      border: 1px solid var(--border); border-radius: var(--r-md);
      background: var(--surface2); color: var(--text); outline: none;
    }
    .hw-search:focus { background: #fff; border-color: #cfd4de; }
    .hw-board { display: flex; flex-direction: column; gap: 10px; }
    .hw-empty { padding: 20px 4px; color: var(--muted); font-size: 13px; }
    .hw-device {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--r-lg); padding: 12px 14px 10px;
    }
    .hw-device-head {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      margin-bottom: 8px; min-width: 0;
    }
    .hw-device-head .dtype {
      font-size: 11px; font-weight: 600; letter-spacing: .04em;
      text-transform: uppercase; color: var(--muted); flex-shrink: 0;
    }
    .hw-device-head .dname {
      font-size: 13px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
    }
    .cap-row {
      display: flex; flex-wrap: wrap; gap: 8px;
      align-items: center; min-height: 32px; margin-bottom: 6px;
    }
    .cap-row:last-child { margin-bottom: 0; }
    .cap-row .cap-lab {
      width: 52px; flex-shrink: 0;
      font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em;
    }
    .sec-overview .cap { background: #fff; }
    .sec-overview .cap .cap-v.temp { color: #c2410c; }
    .sec-overview .cap .cap-v.load { color: #15803d; }
    .sec-overview .cap .cap-v.power { color: #7e22ce; }
    .sec-overview .cap .cap-v.clock { color: #1d4ed8; }

    .foot { margin-top: 18px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 999; justify-content: center; align-items: center; }
    .modal { background: #fff; padding: 24px; border-radius: 16px; border: 1px solid var(--border); width: 320px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
    .modal h3 { margin: 0; font-size: 16px; }
    .inp { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 10px; outline: none; font: 14px var(--font); }
    .inp.error { border-color: var(--crit); animation: shake .4s ease-in-out; }
    .btn-primary { background: var(--ok); border: none; padding: 10px; border-radius: 10px; color: #fff; font: 600 14px var(--font); cursor: pointer; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="dot off" id="brandDot"></div>
      <h1>看板</h1>
      <span>LiteMonitor</span>
      <span class="ver">v2</span>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="btnRefresh"><span class="ico">↻</span> 刷新</button>
      <button type="button" class="btn" id="btnOpenData">打开目录</button>
      <button type="button" class="btn danger" id="btnClearData">清空数据</button>
      <button type="button" class="btn" id="btnAuth" style="display:none">认证</button>
    </div>
  </header>

  <div class="timebar">
    <div class="range" id="rangeSelector">
      <button type="button" data-mode="live" class="on">30分钟</button>
      <button type="button" data-mode="day">按天</button>
    </div>
    <div class="day-nav-wrap" id="dayNavWrap">
      <div class="day-nav">
        <button type="button" class="nav-btn" id="btnPrevDay">‹</button>
        <button type="button" class="day-btn" id="btnDayLabel" aria-haspopup="dialog" aria-expanded="false"><span id="dayLabelText">今天</span></button>
        <button type="button" class="nav-btn" id="btnNextDay">›</button>
      </div>
      <button type="button" class="btn-today" id="btnToday">今天</button>
      <div class="cal" id="calPopover" role="dialog">
        <div class="cal-head">
          <button type="button" class="cal-nav" id="calPrev">‹</button>
          <span class="cal-title" id="calTitle">—</span>
          <button type="button" class="cal-nav" id="calNext">›</button>
        </div>
        <div class="cal-dows" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-foot">
          <span class="hint" id="calHint">最近 7 天</span>
          <button type="button" class="cal-jump" id="calJumpToday">跳到今天</button>
        </div>
      </div>
    </div>
  </div>

  <section class="dash-section sec-timelines" data-section="timelines" aria-labelledby="sec-timelines">
    <div class="sec-head">
      <h2 id="sec-timelines">时间线</h2>
      <span class="hint">CPU / GPU · 内存 · 网络</span>
    </div>
    <div class="sec-body">
      <div class="legend-row">
        <span class="legend-item"><span class="swatch" style="background:var(--ok)"></span>健康</span>
        <span class="legend-item"><span class="swatch" style="background:var(--warn)"></span>偏高</span>
        <span class="legend-item"><span class="swatch" style="background:var(--crit)"></span>严重</span>
        <span class="legend-item"><span class="swatch" style="background:var(--empty)"></span>无数据</span>
      </div>
      <div class="timelines" id="timelines"></div>
    </div>
  </section>

  <section class="dash-section sec-overview" data-section="overview" aria-labelledby="sec-overview">
    <div class="sec-head">
      <h2 id="sec-overview">总览</h2>
      <span class="hint">全部硬件传感器</span>
    </div>
    <div class="sec-body">
      <div class="hw-toolbar">
        <input type="search" class="hw-search" id="hwSearch" placeholder="筛选设备 / 传感器…" autocomplete="off" />
      </div>
      <div class="hw-board" id="hwTree"><div class="hw-empty">等待连接…</div></div>
    </div>
  </section>

  <footer class="foot"><span id="footInfo">—</span><span id="clock">—</span></footer>
</div>

<div id="auth-modal" class="modal-overlay">
  <div class="modal">
    <h3>访问密码</h3>
    <input type="password" id="pwd-input" class="inp" placeholder="Enter password..." />
    <button class="btn-primary" onclick="savePwd()">连接</button>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const AUTH_REQUIRED = {{AUTH_REQUIRED}};
const ALWAYS_PANELS = new Set(["cpuLoad","cpuTemp","gpuLoad","gpuTemp","ram","net"]);
const ST = { ok:{label:"健康"}, warn:{label:"偏高"}, crit:{label:"严重"}, empty:{label:"无数据"} };
const LEVEL = { ok:0, warn:1, crit:2 };
const DOW = ["周日","周一","周二","周三","周四","周五","周六"];
const MON = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

let HISTORY_DAYS = 7;
let pwd = localStorage.getItem("ws_pwd") || "";
let viewMode = "live";
let selectedDay = null;
let currentBuckets = [];
let currentPanels = [];
let currentFlags = {};
let liveItems = [];
let lastStats = {};
let ramTotalGB = 0;
let lastTree = [];
let treeFilter = "";
let hwSig = "";
let busy = false;
let ws = null;
let reconnectTimer = null;
let calMonth = null;
let calOpen = false;

if (AUTH_REQUIRED) {
  $("btnAuth").style.display = "";
  $("btnAuth").addEventListener("click", showAuth);
  if (!pwd) showAuth();
}

function withPwd(url) {
  if (!pwd) return url;
  return url + (url.includes("?") ? "&" : "?") + "pwd=" + encodeURIComponent(pwd);
}
function qs() { return pwd ? "?pwd=" + encodeURIComponent(pwd) : ""; }

function sevPct(v){ if(v==null||v<0)return"neutral"; if(v>=90)return"crit"; if(v>=70)return"warn"; return"ok"; }
function sevRam(v){ if(v==null||v<0)return"neutral"; if(v>=90)return"crit"; if(v>=80)return"warn"; return"ok"; }
function sevTemp(v){ if(v==null||v<0)return"neutral"; if(v>=85)return"crit"; if(v>=75)return"warn"; return"ok"; }
function sevCls(s){ return s==="neutral"?"neutral":("sev-"+s); }
function stsToSev(sts){ return sts===2?"crit":sts===1?"warn":sts===0?"ok":"neutral"; }
function pad2(n){ return String(n).padStart(2,"0"); }
function pill(t,s){ return `<span class="pill ${s}">${t}</span>`; }
function fmtPct(v){ return v==null||v<0?"—":Math.round(v)+"%"; }
function fmtTemp(v){ return v==null||v<0?"—":Math.round(v)+"°C"; }
function fmtMemUsed(pct){
  if(pct==null||pct<0) return "—";
  if(!(ramTotalGB>0)) return fmtPct(pct);
  const used = (pct/100)*ramTotalGB;
  if(used < 10) return used.toFixed(2)+" GB";
  if(used < 100) return used.toFixed(1)+" GB";
  return Math.round(used)+" GB";
}
function findItem(items,key){ return (items||[]).find(i=>i.k===key||i.k.toLowerCase()===key.toLowerCase()); }
function itemText(item){ if(!item)return"—"; return item.u? (item.v+" "+item.u): (item.v||"—"); }
function itemRaw(item){ if(!item)return null; if(typeof item.raw==="number"&&!isNaN(item.raw))return item.raw; const n=parseFloat(item.v); return isNaN(n)?null:n; }
function bucketVal(b,key){ if(!b||b.empty||!b.v)return null; const v=b.v[key]; return (v==null||v<0)?null:+v; }

function toDayKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function parseDayKey(key){ const [y,m,d]=key.split("-").map(Number); return new Date(y,m-1,d); }
function startOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function todayKey(){ return toDayKey(startOfDay(new Date())); }
function minDayKey(){ const d=startOfDay(new Date()); d.setDate(d.getDate()-HISTORY_DAYS); return toDayKey(d); }
function formatDayTitle(key){
  const d=parseDayKey(key), today=startOfDay(new Date());
  if(isSameDay(d,today))return"今天";
  const yest=new Date(today); yest.setDate(today.getDate()-1);
  if(isSameDay(d,yest))return"昨天";
  return DOW[d.getDay()]+" · "+MON[d.getMonth()]+d.getDate()+"日";
}

function syncDayNav(){
  const isDay=viewMode==="day";
  $("dayNavWrap").classList.toggle("show", isDay);
  if(!isDay){ closeCal(); return; }
  if(!selectedDay) selectedDay=todayKey();
  const today=todayKey();
  $("dayLabelText").textContent=formatDayTitle(selectedDay);
  $("btnPrevDay").disabled=selectedDay<=minDayKey();
  $("btnNextDay").disabled=selectedDay>=today;
  $("btnToday").disabled=selectedDay===today;
  $("calHint").textContent="最近 "+HISTORY_DAYS+" 天";
}
function setMode(mode, dayKey){
  viewMode=mode;
  if(mode==="day") selectedDay=dayKey||selectedDay||todayKey();
  $("rangeSelector").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.mode===mode));
  syncDayNav();
  requestHisto();
}
function shiftDay(delta){
  const d=parseDayKey(selectedDay); d.setDate(d.getDate()+delta);
  const key=toDayKey(d);
  if(key>todayKey()||key<minDayKey()) return;
  setMode("day", key);
}
function closeCal(){ calOpen=false; $("calPopover").classList.remove("open"); $("btnDayLabel").classList.remove("open"); $("btnDayLabel").setAttribute("aria-expanded","false"); }
function openCal(){ const base=parseDayKey(selectedDay||todayKey()); calMonth=new Date(base.getFullYear(),base.getMonth(),1); calOpen=true; $("calPopover").classList.add("open"); $("btnDayLabel").classList.add("open"); $("btnDayLabel").setAttribute("aria-expanded","true"); renderCal(); }
function toggleCal(){ if(calOpen) closeCal(); else openCal(); }
function monthBounds(){ return { min: parseDayKey(minDayKey()), max: startOfDay(new Date()) }; }
function renderCal(){
  if(!calMonth) return;
  const {min,max}=monthBounds();
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  $("calTitle").textContent=y+"年"+MON[m];
  const first=new Date(y,m,1), startPad=first.getDay(), daysInMonth=new Date(y,m+1,0).getDate(), prevDays=new Date(y,m,0).getDate();
  const grid=$("calGrid"); grid.innerHTML="";
  const cells=[];
  for(let i=0;i<startPad;i++) cells.push({date:new Date(y,m-1,prevDays-startPad+1+i), muted:true});
  for(let d=1;d<=daysInMonth;d++) cells.push({date:new Date(y,m,d), muted:false});
  while(cells.length%7!==0){ const n=cells.length-startPad-daysInMonth+1; cells.push({date:new Date(y,m+1,n), muted:true}); }
  const today=startOfDay(new Date()), sel=selectedDay?parseDayKey(selectedDay):null;
  cells.forEach(cell=>{
    const key=toDayKey(cell.date);
    const btn=document.createElement("button");
    btn.type="button"; btn.className="cal-day"; btn.textContent=String(cell.date.getDate());
    if(cell.muted) btn.classList.add("muted");
    if(isSameDay(cell.date,today)) btn.classList.add("today");
    if(sel&&isSameDay(cell.date,sel)) btn.classList.add("sel");
    const sod=startOfDay(cell.date);
    if(sod<min||sod>max) btn.disabled=true;
    else btn.addEventListener("click",()=>{ closeCal(); setMode("day", key); });
    grid.appendChild(btn);
  });
  const monthStart=new Date(y,m,1), monthEnd=new Date(y,m+1,0);
  $("calPrev").disabled=monthEnd<min;
  $("calNext").disabled=monthStart>max;
  $("calJumpToday").disabled=selectedDay===todayKey();
}
function shiftCalMonth(delta){ if(!calMonth)return; calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+delta,1); renderCal(); }

function showAuth(){
  const modal=$("auth-modal");
  if(modal.style.display==="flex") return;
  modal.style.display="flex";
  const inp=$("pwd-input"); inp.value=pwd; inp.classList.remove("error"); inp.focus();
}
async function savePwd(){
  const inp=$("pwd-input"); const newPwd=inp.value;
  if(AUTH_REQUIRED){
    try{
      const res=await fetch("/api/snapshot?pwd="+encodeURIComponent(newPwd));
      if(res.status===401){ inp.classList.remove("error"); void inp.offsetWidth; inp.classList.add("error"); inp.value=""; inp.placeholder="密码错误"; return; }
    }catch(e){ console.error(e); }
  }
  pwd=newPwd; localStorage.setItem("ws_pwd", pwd); $("auth-modal").style.display="none";
  if(ws){ ws.onclose=null; ws.close(); ws=null; }
  connect(); requestHisto();
}
$("pwd-input").addEventListener("keyup", e=>{ if(e.key==="Enter") savePwd(); });

function setOnline(on){ $("brandDot").classList.toggle("off", !on); }

function connect(){
  if(ws) return;
  const protocol=location.protocol==="https:"?"wss://":"ws://";
  ws=new WebSocket(protocol+location.host+qs());
  ws.onopen=()=>{ setOnline(true); pullSnapshot(); if(reconnectTimer){ clearInterval(reconnectTimer); reconnectTimer=null; } };
  ws.onmessage=ev=>{ try{ renderLive(JSON.parse(ev.data)); }catch(e){ console.error(e); } };
  ws.onclose=()=>{
    setOnline(false); ws=null;
    const handleReconnect=()=>{ if(!reconnectTimer) reconnectTimer=setInterval(connect,2000); };
    if(AUTH_REQUIRED){
      fetch("/api/snapshot?pwd="+encodeURIComponent(pwd)).then(res=>{
        if(res.status===401){ showAuth(); if(reconnectTimer){ clearInterval(reconnectTimer); reconnectTimer=null; } }
        else handleReconnect();
      }).catch(()=>handleReconnect());
    } else handleReconnect();
  };
  ws.onerror=()=>ws&&ws.close();
}

function renderLive(data){
  liveItems = data.items || [];
  if (data.sys && typeof data.sys.ramTotalGB === "number" && data.sys.ramTotalGB > 0)
    ramTotalGB = data.sys.ramTotalGB;
  if (Array.isArray(data.tree)) {
    lastTree = data.tree;
    renderHwTree();
  }
  updatePanelInlines();
}

async function pullSnapshot(){
  try{
    const res = await fetch(withPwd("/api/snapshot"));
    if(res.status===401){ showAuth(); return; }
    if(!res.ok) return;
    renderLive(await res.json());
  }catch(e){ console.error(e); }
}

/* ── Overview: capsule board (dashboard style, full sensor data) ── */
function matchesFilter(text){
  if (!treeFilter) return true;
  return String(text||"").toLowerCase().includes(treeFilter);
}
function hardwareMatches(node){
  if (!treeFilter) return true;
  if (matchesFilter(node.t) || matchesFilter(node.n)) return true;
  for (const g of (node.g||[])) {
    if (matchesFilter(g.t)) return true;
    for (const s of (g.s||[])) if (matchesFilter(s.n)) return true;
  }
  for (const c of (node.c||[])) if (hardwareMatches(c)) return true;
  return false;
}
function valClass(groupKey){
  const k = String(groupKey||"").toLowerCase();
  if (k === "temperature") return "temp";
  if (k === "load" || k === "level") return "load";
  if (k === "power") return "power";
  if (k === "clock") return "clock";
  return "";
}
function esc(s){
  return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function shortSensorName(name){
  const n = String(name||"").trim();
  if (n.length <= 22) return n;
  return n.slice(0, 20) + "…";
}

function flattenDevices(nodes, out){
  (nodes||[]).forEach(n => {
    const hasSensors = (n.g||[]).some(g => (g.s||[]).length);
    if (hasSensors || !(n.c||[]).length) out.push(n);
    flattenDevices(n.c, out);
  });
}

function buildDeviceCard(node){
  const card = document.createElement("div");
  card.className = "hw-device";
  card.innerHTML =
    `<div class="hw-device-head">` +
      `<span class="dtype">${esc(node.t||"设备")}</span>` +
      `<span class="dname" title="${esc(node.n||"")}">${esc(node.n||"—")}</span>` +
    `</div>`;

  (node.g||[]).forEach(g => {
    const sensors = (g.s||[]).filter(s => !treeFilter || matchesFilter(s.n) || matchesFilter(g.t) || matchesFilter(node.n) || matchesFilter(node.t));
    if (!sensors.length) return;
    const row = document.createElement("div");
    row.className = "cap-row";
    const lab = document.createElement("div");
    lab.className = "cap-lab";
    lab.textContent = g.t || g.k || "指标";
    row.appendChild(lab);
    const vc = valClass(g.k);
    sensors.forEach(s => {
      const empty = !s.v || s.v === "—";
      const el = document.createElement("span");
      el.className = "cap" + (empty ? " ghost" : "");
      if (s.id) el.dataset.sid = s.id;
      el.title = (s.n || "") + (s.m && s.m !== "—" ? (" · 峰值 " + s.m) : "");
      el.innerHTML =
        `<span class="cap-k">${esc(shortSensorName(s.n))}</span>` +
        `<span class="cap-v ${vc}" data-role="val">${esc(s.v||"—")}</span>`;
      row.appendChild(el);
    });
    card.appendChild(row);
  });

  if (card.children.length <= 1) return null;
  return card;
}

function patchSensorValues(nodes){
  const map = new Map();
  function walk(list){
    (list||[]).forEach(n => {
      (n.g||[]).forEach(g => (g.s||[]).forEach(s => { if (s.id) map.set(s.id, s); }));
      walk(n.c);
    });
  }
  walk(nodes);
  $("hwTree").querySelectorAll(".cap[data-sid]").forEach(el => {
    const s = map.get(el.dataset.sid);
    if (!s) return;
    const v = el.querySelector('[data-role="val"]');
    if (v) v.textContent = s.v || "—";
    el.classList.toggle("ghost", !s.v || s.v === "—");
    el.title = (s.n || "") + (s.m && s.m !== "—" ? (" · 峰值 " + s.m) : "");
  });
}

function renderHwTree(){
  const root = $("hwTree");
  if (!lastTree.length) {
    root.innerHTML = `<div class="hw-empty">暂无硬件信息</div>`;
    hwSig = "";
    return;
  }

  const sig = lastTree.map(n => (n.k||"")+"|"+(n.n||"")+"|"+(n.g||[]).length+"|"+(n.c||[]).length).join(";") + "|" + treeFilter;
  if (sig === hwSig && root.querySelector(".hw-device")) {
    patchSensorValues(lastTree);
    return;
  }

  const devices = [];
  flattenDevices(treeFilter ? lastTree.filter(hardwareMatches) : lastTree, devices);
  root.innerHTML = "";
  if (!devices.length) {
    root.innerHTML = `<div class="hw-empty">无匹配项</div>`;
    hwSig = sig;
    return;
  }
  devices.forEach(n => {
    if (treeFilter && !hardwareMatches(n)) return;
    const card = buildDeviceCard(n);
    if (card) root.appendChild(card);
  });
  if (!root.children.length)
    root.innerHTML = `<div class="hw-empty">无匹配项</div>`;
  hwSig = sig;
}

$("hwSearch").addEventListener("input", e => {
  treeFilter = (e.target.value || "").trim().toLowerCase();
  hwSig = "";
  renderHwTree();
});

function fmtBytes(n){
  if(n==null||n<0)return"—";
  if(n>=1e12)return(n/1e12).toFixed(2)+" TB";
  if(n>=1e9)return(n/1e9).toFixed(2)+" GB";
  if(n>=1e6)return(n/1e6).toFixed(1)+" MB";
  if(n>=1e3)return(n/1e3).toFixed(0)+" KB";
  return Math.round(n)+" B";
}
function bucketBytes(b,key){ if(!b||b.empty||!b.bytes)return 0; return +(b.bytes[key]||0); }

/* ── Timelines ── */
function levelFor(panel, b){
  if(!b||b.empty) return "empty";
  if(panel.kind==="volume") return "net";
  const p=bucketVal(b, panel.primary);
  if(panel.sev==="temp") return p==null?"empty":sevTemp(p);
  if(panel.sev==="memAbs" || panel.sev==="ram") return p==null?"empty":sevRam(p);
  if(panel.sev==="pct") return p==null?"empty":sevPct(p);
  return p==null?"empty":"ok";
}
function panelHasData(panel, flags){
  if(ALWAYS_PANELS.has(panel.id)) return true;
  if(panel.kind==="volume") return !!(flags[panel.a]||flags[panel.b]);
  return !!(flags[panel.primary]);
}
function ensurePanels(panels){
  const root=$("timelines");
  currentPanels=panels||[];
  const want = new Set(currentPanels.map(p=>p.id));
  [...root.querySelectorAll(".metric-panel")].forEach(el => { if (!want.has(el.dataset.id)) el.remove(); });
  const existing=new Set([...root.querySelectorAll(".metric-panel")].map(el=>el.dataset.id));
  currentPanels.forEach(p=>{
    if(existing.has(p.id)) return;
    const el=document.createElement("div");
    el.className="metric-panel";
    el.dataset.id=p.id;
    el.dataset.kind=p.kind;
    const right = p.kind==="volume"
      ? `<div class="totals" data-role="totals"><span class="dir">${p.aLabel||"↓"}</span> <span data-role="totalA">—</span><span class="sep">·</span><span class="dir">${p.bLabel||"↑"}</span> <span data-role="totalB">—</span></div>`
      : "";
    el.innerHTML =
      `<div class="metric-head"><div class="left"><h2>${p.title}</h2><span class="metric-caps" data-role="inline"></span></div>${right}</div>`+
      `<div class="bars ${p.kind==="volume"?"volume":""}" data-role="bars"></div>`+
      `<div class="bar-axis"><span class="axisL">—</span><span class="axisR">—</span></div>`+
      `<div class="metric-rule">${p.rule||""}</div>`+
      `<div class="bar-tip" data-role="tip"><div class="time" data-role="time">—</div><div class="status-row"><span class="status-dot ok" data-role="dot"></span><span class="status-label" data-role="label">—</span></div><div class="vals" data-role="vals"></div></div>`;
    root.appendChild(el);
    bindPanelBars(el, p);
  });
}

function metricCapHtml(label, text, sev){
  const empty = text == null || text === "" || text === "—";
  const sevClass = (!empty && sev && sev !== "neutral") ? (" sev-" + sev) : "";
  return `<span class="cap${empty?" ghost":""}"><span class="cap-k">${label}</span><span class="cap-v${sevClass}">${text || "—"}</span></span>`;
}

function panelCapsHtml(panel){
  if (panel.kind === "volume") {
    return metricCapHtml("时段", viewMode === "live" ? "近30分钟" : "当日合计", "neutral");
  }
  const it = findItem(liveItems, panel.primary);
  const s = lastStats[panel.primary];
  const avg = s && typeof s.avg === "number" && s.avg >= 0 ? s.avg : null;
  let liveText = "—", liveSev = "neutral";
  let avgText = "—", avgSev = "neutral";

  if (panel.sev === "memAbs") {
    const pct = it ? (it.pct ?? itemRaw(it)) : null;
    liveText = fmtMemUsed(pct);
    liveSev = sevRam(pct);
    avgText = fmtMemUsed(avg);
    avgSev = sevRam(avg);
  } else if (panel.sev === "temp") {
    liveText = it ? fmtTemp(itemRaw(it)) : "—";
    liveSev = it ? stsToSev(it.sts) : "neutral";
    avgText = fmtTemp(avg);
    avgSev = sevTemp(avg);
  } else {
    const p = it ? (it.pct ?? itemRaw(it)) : null;
    liveText = p==null ? "—" : Math.round(p)+"%";
    liveSev = it ? stsToSev(it.sts) : "neutral";
    avgText = avg==null ? "—" : Math.round(avg)+"%";
    avgSev = sevPct(avg);
  }
  return metricCapHtml("现", liveText, liveSev) + metricCapHtml("均", avgText, avgSev);
}

function updatePanelInlines(){
  currentPanels.forEach(p=>{
    const el=document.querySelector(`.metric-panel[data-id="${p.id}"]`);
    if(!el) return;
    const inline=el.querySelector('[data-role="inline"]');
    if(inline) inline.innerHTML=panelCapsHtml(p);
  });
}

function renderTimelines(data){
  currentBuckets=data.buckets||[];
  currentFlags=data.flags||{};
  lastStats=data.stats||{};
  if (typeof data.ramTotalGB === "number" && data.ramTotalGB > 0) ramTotalGB = data.ramTotalGB;
  if(typeof data.retentionDays==="number") HISTORY_DAYS=data.retentionDays;
  ensurePanels(data.panels||[]);
  document.querySelectorAll(".axisL").forEach(el=>el.textContent=data.axisL||"—");
  document.querySelectorAll(".axisR").forEach(el=>el.textContent=data.axisR||"—");

  currentPanels.forEach(panel=>{
    const el=document.querySelector(`.metric-panel[data-id="${panel.id}"]`);
    if(!el) return;
    const show=panelHasData(panel, currentFlags);
    el.classList.toggle("hidden", !show);
    if(!show) return;
    const barsEl=el.querySelector('[data-role="bars"]');
    barsEl.innerHTML="";
    if(panel.kind==="volume"){
      const withData=currentBuckets.filter(b=>!b.empty);
      const maxBytes=Math.max(1, ...withData.map(b=>bucketBytes(b,panel.a)+bucketBytes(b,panel.b)));
      let totA=0, totB=0;
      currentBuckets.forEach((b,i)=>{
        const bar=document.createElement("div");
        if(b.empty){ bar.className="bar empty"; bar.style.height="3px"; }
        else {
          const total=bucketBytes(b,panel.a)+bucketBytes(b,panel.b);
          totA+=bucketBytes(b,panel.a); totB+=bucketBytes(b,panel.b);
          bar.className="bar"; bar.style.height=Math.max(4, Math.round((total/maxBytes)*36))+"px";
        }
        bar.dataset.i=i; barsEl.appendChild(bar);
      });
      const tA=el.querySelector('[data-role="totalA"]'); const tB=el.querySelector('[data-role="totalB"]');
      if(tA) tA.textContent=fmtBytes(totA); if(tB) tB.textContent=fmtBytes(totB);
    } else {
      currentBuckets.forEach((b,i)=>{
        const lv=levelFor(panel,b);
        const bar=document.createElement("div");
        bar.className="bar "+(lv==="net"?"ok":lv);
        bar.dataset.i=i; barsEl.appendChild(bar);
      });
    }
  });
  updatePanelInlines();
  $("footInfo").textContent =
    (data.bucketCount||0)+" 段 · "+(data.pointCount||0)+" 采样 · "+
    (viewMode==="live"?"近 30 分钟":(selectedDay+" 全天"));
}

function bucketTimeLabel(i,n){
  if(viewMode==="day") return pad2(i)+":00 – "+pad2(i===23?24:i+1)+":00";
  const mins=Math.round((1-i/n)*30);
  return mins>0? mins+" 分钟前":"现在";
}

function tipContent(panel,b){
  if(!b||b.empty) return [pill("无采样","neutral")];
  if(panel.kind==="volume"){
    const a=bucketBytes(b,panel.a), bb=bucketBytes(b,panel.b);
    return [
      pill((panel.aLabel||"↓")+" "+fmtBytes(a),"neutral"),
      pill((panel.bLabel||"↑")+" "+fmtBytes(bb),"neutral"),
      pill("合计 "+fmtBytes(a+bb),"neutral")
    ];
  }
  const p=bucketVal(b,panel.primary);
  if(panel.sev==="memAbs") return [pill(fmtMemUsed(p), sevRam(p))];
  if(panel.sev==="temp") return [pill(fmtTemp(p), sevTemp(p))];
  return [pill(fmtPct(p), sevPct(p))];
}

function bindPanelBars(el, panel){
  const barsEl=el.querySelector('[data-role="bars"]');
  const tip=el.querySelector('[data-role="tip"]');
  barsEl.addEventListener("mousemove", e=>{
    const bar=e.target.closest(".bar"); if(!bar) return;
    barsEl.querySelectorAll(".bar").forEach(x=>x.classList.remove("on"));
    bar.classList.add("on");
    const b=currentBuckets[+bar.dataset.i]; if(!b) return;
    const i=+bar.dataset.i;
    const lv=levelFor(panel,b);
    const isVol=panel.kind==="volume";
    tip.querySelector('[data-role="time"]').textContent=bucketTimeLabel(i, currentBuckets.length);
    tip.querySelector('[data-role="dot"]').className="status-dot "+(b.empty?"empty":(isVol?"net":lv));
    const label=tip.querySelector('[data-role="label"]');
    label.textContent=b.empty?"无数据":(isVol?"流量":(ST[lv]?ST[lv].label:lv));
    label.className="status-label "+(b.empty||isVol||lv==="empty"?"neutral":sevCls(lv));
    tip.querySelector('[data-role="vals"]').innerHTML=tipContent(panel,b).join("");
    tip.classList.add("show");
    const hr=el.getBoundingClientRect(), br=bar.getBoundingClientRect();
    let left=br.left-hr.left+br.width/2-(tip.offsetWidth||200)/2;
    left=Math.max(4, Math.min(left, hr.width-(tip.offsetWidth||200)-4));
    tip.style.left=left+"px";
    tip.style.bottom=(hr.height-(br.top-hr.top)+10)+"px";
  });
  barsEl.addEventListener("mouseleave",()=>{ tip.classList.remove("show"); barsEl.querySelectorAll(".bar").forEach(x=>x.classList.remove("on")); });
}

function setRefreshBusy(on){ const btn=$("btnRefresh"); btn.disabled=on; btn.classList.toggle("spinning",on); }

async function requestHisto(){
  if(busy) return;
  busy=true; setRefreshBusy(true);
  try{
    let url="/api/history?mode="+encodeURIComponent(viewMode);
    if(viewMode==="day") url+="&day="+encodeURIComponent(selectedDay||todayKey());
    const res=await fetch(withPwd(url));
    if(res.status===401){ showAuth(); return; }
    const data=await res.json();
    renderTimelines(data);
    syncDayNav();
  }catch(e){ console.error(e); $("footInfo").textContent="历史数据不可用"; }
  finally{ busy=false; setRefreshBusy(false); }
}
